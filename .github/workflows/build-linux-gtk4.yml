name: Build and Push Ubuntu-Rust-gtk4

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "ubuntu-rust-gtk4/**"
  schedule:
    - cron: "18 9 1 * *"

jobs:
  build-and-push:
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            arch: amd64
            gtk: 418
            codename: plucky
            os: ubuntu-latest
          - platform: arm64
            arch: arm64v8
            gtk: 418
            codename: plucky
            os: ubuntu-24.04-arm
          - platform: amd64
            arch: amd64
            gtk: 416
            codename: oracular
            os: ubuntu-latest
          - platform: arm64
            arch: arm64v8
            gtk: 416
            codename: oracular
            os: ubuntu-24.04-arm

    runs-on: ${{matrix.os}}

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Github Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER@L}" >> ${GITHUB_ENV}

      - name: Build and push gtk${{matrix.gtk}}-${{ matrix.platform }}-stable
        uses: docker/build-push-action@v6
        with:
          context: ubuntu-rust-gtk4
          platforms: linux/${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk${{matrix.gtk}}-stable-${{ matrix.platform }}
          build-args: |
            ARCH=${{ matrix.arch }}
            CODENAME=${{matrix.codename}}
            TOOLCHAIN=stable
          provenance: false

      - name: Build and push gtk${{matrix.gtk}}-${{ matrix.platform }}-nightly
        uses: docker/build-push-action@v6
        with:
          context: ubuntu-rust-gtk4
          platforms: linux/${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk${{matrix.gtk}}-nightly-${{ matrix.platform }}
          build-args: |
            ARCH=${{ matrix.arch }}
            CODENAME=${{matrix.codename}}
            TOOLCHAIN=nightly
          provenance: false

  merge:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false

    steps:
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      # - name: Create multi-arch manifest on Docker Hub
      #   run: |
      #     docker manifest create ${{ secrets.DOCKERHUB_USERNAME }}/ubuntu-rust-gtk4:latest \
      #       ${{ secrets.DOCKERHUB_USERNAME }}/ubuntu-rust-gtk4:amd64 \
      #       ${{ secrets.DOCKERHUB_USERNAME }}/ubuntu-rust-gtk4:arm64
      #     docker manifest annotate ${{ secrets.DOCKERHUB_USERNAME }}/ubuntu-rust-gtk4:latest \
      #       ${{ secrets.DOCKERHUB_USERNAME }}/ubuntu-rust-gtk4:amd64 --arch amd64
      #     docker manifest annotate ${{ secrets.DOCKERHUB_USERNAME }}/ubuntu-rust-gtk4:latest \
      #       ${{ secrets.DOCKERHUB_USERNAME }}/ubuntu-rust-gtk4:arm64 --arch arm64
      #     docker manifest push ${{ secrets.DOCKERHUB_USERNAME }}/ubuntu-rust-gtk4:latest

      - name: Login to Github Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER@L}" >> ${GITHUB_ENV}

      - name: Create multi-arch manifest gtk4.16
        run: |
          docker manifest create ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk416-stable-latest \
            ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk416-stable-amd64 \
            ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk416-stable-arm64
          docker manifest annotate ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk416-stable-latest \
            ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk416-stable-amd64 --arch amd64
          docker manifest annotate ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk416-stable-latest \
            ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk416-stable-arm64 --arch arm64
          docker manifest push ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk416-stable-latest
          docker manifest create ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk416-nightly-latest \
            ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk416-nightly-amd64 \
            ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk416-nightly-arm64
          docker manifest annotate ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk416-nightly-latest \
            ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk416-nightly-amd64 --arch amd64
          docker manifest annotate ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk416-nightly-latest \
            ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk416-nightly-arm64 --arch arm64
          docker manifest push ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk416-nightly-latest

      - name: Create multi-arch manifest gtk4 latest
        run: |
          docker manifest create ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:stable-latest \
            ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk418-stable-amd64 \
            ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk418-stable-arm64
          docker manifest annotate ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:stable-latest \
            ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk418-stable-amd64 --arch amd64
          docker manifest annotate ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:stable-latest \
            ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk418-stable-arm64 --arch arm64
          docker manifest push ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:stable-latest
          docker manifest create ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:nightly-latest \
            ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk418-nightly-amd64 \
            ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk418-nightly-arm64
          docker manifest annotate ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:nightly-latest \
            ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk418-nightly-amd64 --arch amd64
          docker manifest annotate ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:nightly-latest \
            ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk418-nightly-arm64 --arch arm64
          docker manifest push ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:nightly-latest

      - name: Check push
        run: |
          docker buildx imagetools inspect ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:stable-latest
          docker buildx imagetools inspect ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk416-stable-latest
          docker buildx imagetools inspect ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:nightly-latest
          docker buildx imagetools inspect ghcr.io/${{ env.OWNER }}/ubuntu-rust-gtk4:gtk416-nightly-latest
